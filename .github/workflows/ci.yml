name: Source checks
on: [push, pull_request]
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q tfdvee
      - run: python -c "import tfdvee; import tfdvee.frontend; import tfdvee.run; import tfdvee.metrics; import tfdvee.__main__; from transformers import CLIPModel, CLIPProcessor, Blip2ForConditionalGeneration, Blip2Processor"
